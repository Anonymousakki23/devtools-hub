name: Daily Pipeline - Collect, Generate, Deploy

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM UTC
  workflow_dispatch:
    inputs:
      force_full_collection:
        description: 'Force full collection (ignore rate limits)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: data/
          key: devtools-data-${{ github.run_id }}
          restore-keys: devtools-data-

      - name: Collect data from all sources
        run: npx tsx scripts/collect.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_FULL: ${{ github.event.inputs.force_full_collection }}

      - name: Generate SEO-optimized pages
        run: npx tsx scripts/generate-pages.ts

      - name: Run optimization loop
        run: npx tsx scripts/optimize.ts

      - name: Build static site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out/

      - name: Deploy to Cloudflare Pages
        run: |
          npx wrangler pages deploy out/ --project-name=${{ vars.CF_PROJECT_NAME || 'devtools-hub' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ public/sitemap.xml public/robots.txt
          git diff --staged --quiet || git commit -m "chore: daily data update $(date -u +%Y-%m-%d)"
          git push

      - name: Pipeline summary
        if: success()
        run: |
          echo "## Daily Pipeline Complete ✅" >> $GITHUB_STEP_SUMMARY
          echo "- Data collected from all sources" >> $GITHUB_STEP_SUMMARY
          echo "- Pages generated and optimized" >> $GITHUB_STEP_SUMMARY
          echo "- Site deployed to Cloudflare Pages" >> $GITHUB_STEP_SUMMARY
          echo "- Sitemap and robots.txt updated" >> $GITHUB_STEP_SUMMARY

  notify-failure:
    needs: pipeline
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Create issue on failure
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Daily pipeline failed - ' + new Date().toISOString().split('T')[0],
              body: 'The daily data collection pipeline failed. Check the [workflow logs](' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId + ') for details.',
              labels: ['bug', 'pipeline'],
            });
